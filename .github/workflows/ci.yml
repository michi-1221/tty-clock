name: ci

# Build, vet, test and format-check on every push to main and every PR — so
# breakage is caught before a release tag is cut (release.yml handles tags).
on:
  push:
    branches: [main]
    paths:
      - 'internal/**'
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # The build above already exercises the windows-only winsize_other.go.
      # Tests run on unix only: the render golden fixtures are committed with LF
      # and would mismatch under Windows' autocrlf checkout.
      - name: go test
        if: runner.os != 'Windows'
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error::these files need 'gofmt -w':"
            echo "$files"
            exit 1
          fi
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
